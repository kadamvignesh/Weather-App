<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima • Aesthetic Weather</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Search -->
    <div class="search-bar">
      <input type="text" id="city-input" placeholder="Search city... (e.g. Mumbai)" autocomplete="off">
      <button id="search-btn">🔍</button>
    </div>

    <!-- Main Card -->
    <div class="weather-card" id="weather-card">
      <div class="location" id="location">Mumbai, India</div>
      <div class="date" id="date"></div>

      <div class="temp-container">
        <div class="temperature" id="temperature">--°C</div>
        <img id="weather-icon" src="" alt="weather">
      </div>

      <div class="description" id="description">Clear Sky</div>

      <!-- Details -->
      <div class="details">
        <div class="detail-item">
          <span>Feels like</span>
          <strong id="feels-like">--°C</strong>
        </div>
        <div class="detail-item">
          <span>Humidity</span>
          <strong id="humidity">--%</strong>
        </div>
        <div class="detail-item">
          <span>Wind</span>
          <strong id="wind">-- km/h</strong>
        </div>
      </div>
    </div>

    <!-- Forecast -->
    <div class="forecast">
      <h3>5-Day Forecast</h3>
      <div class="forecast-container" id="forecast-container">
        <!-- JS will fill this -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
